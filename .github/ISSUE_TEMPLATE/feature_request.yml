name: 💡 Feature request
description: Propose a new feature or an improvement to existing plugin behavior
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem you're facing
      description: Where are you stuck, or what is the plugin missing? Describe the real-world situation.
      placeholder: |
        E.g.: My repo uses GitLab CI, not GitHub Actions, so review_ci_status doesn't work because
        the plugin only reads status via gh pr checks.
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: How do you think this should be handled? Doesn't need to be exact, just needs to be clear.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered (if any)
      description: Have you tried any other way to solve this problem? Why wasn't it good enough?
    validations:
      required: false
