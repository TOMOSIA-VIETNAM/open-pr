name: 🐛 Bug report
description: The plugin reviews incorrectly, crashes, or doesn't behave as expected
labels: ["bug"]
body:
  - type: textarea
    id: description
    attributes:
      label: Bug description
      description: What happened? What did you expect instead?
      placeholder: |
        E.g.: Ran /open-pr:review on PR X, the plugin posted a review but the LINE-level comment
        was attached to the wrong line. Expected: comment on the actual changed line in the diff.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: The more specific, the easier to fix — commands typed, order of actions.
      placeholder: |
        1. /open-pr:review https://github.com/<owner>/<repo>/pull/<n>
        2. ...
    validations:
      required: true

  - type: input
    id: pr_url
    attributes:
      label: PR URL when the bug occurred (if any)
      description: Link to the actual PR being reviewed when the bug occurred — helps reproduce accurately.
      placeholder: https://github.com/<owner>/<repo>/pull/<number>
    validations:
      required: false

  - type: textarea
    id: evidence
    attributes:
      label: Evidence (log/output/screenshot)
      description: |
        Paste the actual output/log, the broken GitHub comment, a screenshot... The more concrete
        evidence, the faster this can be confirmed and fixed. You can drag-and-drop images directly
        into this field to attach them.
      placeholder: Paste log/error comment link/screenshot here...
    validations:
      required: false

  - type: input
    id: version
    attributes:
      label: Plugin version in use
      description: Check via `/plugin list` in Claude Code, or the latest release tag you updated to.
      placeholder: e.g. v0.2.0, or a commit SHA
    validations:
      required: false

  - type: textarea
    id: env
    attributes:
      label: Environment
      description: OS, Claude Code version, stack of the repo being reviewed (if relevant to the bug).
      placeholder: |
        - OS: macOS 15
        - Claude Code: ...
        - Stack of repo being reviewed: Rails/Vue/...
    validations:
      required: false
