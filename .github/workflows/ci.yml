name: CI

# No `uses:` in this workflow. The org allows Actions only from repositories it owns, so
# actions/checkout and actions/setup-python failed the whole run at startup and not one
# check ever executed. A local composite action cannot stand in for the checkout either:
# `uses: ./...` needs the repository on disk before it can resolve.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  pull-requests: write

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      # Full history and every tag: token_report diffs against the base branch, and the
      # declared-version test reads the release tags. The repository is public, so this
      # needs no token — GITHUB_REF is refs/pull/<n>/merge on a pull request and
      # refs/heads/main on a push, and both are fetchable anonymously.
      - name: Check out the ref under test
        run: |
          set -euo pipefail
          git init -q .
          git remote add origin "https://github.com/$GITHUB_REPOSITORY"
          git fetch -q --tags origin \
            "+refs/heads/*:refs/remotes/origin/*" "+$GITHUB_REF:refs/ci/head"
          git checkout -q --detach refs/ci/head

      # setup-python is an action, so the interpreter is whatever the runner image ships.
      # The version is asserted rather than assumed: an image bump that moves the minor
      # version fails here instead of somewhere downstream. The dependencies go in a venv
      # because the image's python is externally managed and rejects a plain pip install;
      # GITHUB_PATH puts that venv first for every step after this one.
      - name: Python and the dev dependencies
        run: |
          set -euo pipefail
          python3 -c 'import sys; assert sys.version_info[:2] == (3, 12), sys.version'
          python3 -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/python" -m pip install --quiet -r requirements-dev.txt
          echo "$RUNNER_TEMP/venv/bin" >> "$GITHUB_PATH"

      - name: Prompt-graph invariants
        run: python3 -m pytest tests/ -q

      - name: Duplication scan
        run: python3 scripts/dup_scan.py

      # Pinned, and the URL built the way GitLab actually publishes it: the assets are
      # named linux_amd64 with the dots percent-encoded, not Linux_x86_64. Verified
      # against the releases API rather than assumed.
      - name: Install glab
        env:
          GLAB_VERSION: '1.110.0'
        run: |
          v="${GLAB_VERSION//./%2E}"
          curl -sfL -o /tmp/glab.deb \
            "https://gitlab.com/api/v4/projects/gitlab-org%2Fcli/packages/generic/glab/$v/glab_${v}_linux_amd64%2Edeb"
          sudo dpkg -i /tmp/glab.deb
          glab --version

      # Offline half of the vendor lint: every flag in every vendor entry must exist in
      # that subcommand's own --help. No fixture, no token, no network to a vendor API,
      # so it is safe on a fork PR. The live half needs an open fixture and a PAT, which
      # is why it stays manual (see e2e/README.md).
      - name: Vendor command flags
        run: python3 scripts/vendor_lint.py

      - name: Context cost vs base
        if: github.event_name == 'pull_request'
        run: |
          python3 scripts/token_report.py --base "origin/${{ github.base_ref }}" | tee token-report.txt

      - name: Report the cost on the PR
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          # A fork PR gets a read-only token, so the comment step is skipped there and
          # the job summary carries the numbers instead.
          CAN_COMMENT: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
        run: bash scripts/ci_token_comment.sh token-report.txt
