name: e2e (manual)

# Never automatic: an e2e run costs a real model call and posts to a real vendor, and
# a fork PR is given no secrets. Contributors run e2e/bootstrap.sh locally with their
# own PAT — see e2e/README.md. This workflow only exists so the maintainer can drive
# the same fixture from CI with repo secrets.
on:
  workflow_dispatch:
    inputs:
      vendor:
        description: which vendor to build the fixture on
        type: choice
        options: [github, gitlab, both]
        default: github
      teardown:
        description: delete the fixture instead of creating it
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  fixture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Authenticate the vendor CLIs
        env:
          E2E_GITHUB_PAT: ${{ secrets.E2E_GITHUB_PAT }}
          E2E_GITLAB_PAT: ${{ secrets.E2E_GITLAB_PAT }}
        run: |
          if [ -n "$E2E_GITHUB_PAT" ]; then echo "$E2E_GITHUB_PAT" | gh auth login --with-token; fi
          if [ -n "$E2E_GITLAB_PAT" ]; then
            curl -sL https://gitlab.com/gitlab-org/cli/-/releases/permalink/latest/downloads/glab_$(uname -s)_$(uname -m).tar.gz | tar xz -C /tmp
            sudo install /tmp/bin/glab /usr/local/bin/glab
            glab auth login --token "$E2E_GITLAB_PAT" --hostname gitlab.com
          fi

      - name: Build or tear down the fixture
        run: |
          if [ "${{ inputs.teardown }}" = "true" ]; then
            e2e/bootstrap.sh --vendor "${{ inputs.vendor }}" --teardown
          else
            e2e/bootstrap.sh --vendor "${{ inputs.vendor }}" --recreate
          fi

      - name: Next step
        run: echo "Fixture is up. Run /open-pr:review on the printed URL, then work through e2e/checklist.md."
