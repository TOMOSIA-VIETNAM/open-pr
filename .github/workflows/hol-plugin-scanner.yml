name: HOL Plugin Scanner

# Self-scan against the HOL AI Plugin Scanner, the quality/security gate required
# to list Open PullRequest on awesome-codex-plugins (needs score >= 80, no high/critical
# findings, and the scanner running in CI on the main branch).
#
# The scanner runs from its published wheel rather than from the vendor's own Action.
# This repository is only allowed to run actions owned by TOMOSIA-VIETNAM, so any
# `uses:` pointing at another owner makes the whole workflow fail at startup, before
# a single step runs — a wheel installed inside a `run:` step is not subject to that
# policy. The same rule is why the two GitHub-owned actions below are referenced by
# tag and not by commit SHA: a SHA reference is rejected under this policy too.
#
# The supply-chain pin the vendor Action provides is kept: the wheel is fetched at an
# exact version and its SHA-256 is checked against the digest below, so a wheel
# republished under the same version number fails the job instead of running. To move
# to a newer scanner, bump SCANNER_VERSION and replace SCANNER_SHA256 with the sha256
# digest PyPI reports for that release's py3-none-any wheel.
#
# Runs read-only and does NOT write SARIF: the listing only requires the scanner to
# run with a passing score, so the job keeps `contents: read` and never asks for the
# `security-events: write` that a code-scanning upload would need.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scan:
    name: HOL Plugin Scanner
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SCANNER_VERSION: '2.2.119'
      SCANNER_SHA256: '7e1b6a131abc525dd7cb9691f5b22f4bcb51366023bfcadb529337ebf3a171f8'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install the pinned scanner
        # Downloaded outside the workspace: the scan target is the checkout itself, and
        # a wheel sitting in it would be one more file for the scanner to read.
        run: |
          set -euo pipefail
          dist="$RUNNER_TEMP/scanner-dist"
          wheel="$dist/plugin_scanner-$SCANNER_VERSION-py3-none-any.whl"
          python3 -m pip download --only-binary=:all: --no-deps --dest "$dist" \
            "plugin-scanner==$SCANNER_VERSION"
          echo "$SCANNER_SHA256  $wheel" | sha256sum --check --strict
          python3 -m pip install "$wheel"

      - name: Scan this repository
        run: |
          set -euo pipefail
          plugin-scanner scan . --format text --min-score 80 --fail-on-severity high \
            | tee "$RUNNER_TEMP/scan.txt"

      - name: Report the scan on the job summary
        if: always()
        run: |
          set -euo pipefail
          report="$RUNNER_TEMP/scan.txt"
          [ -s "$report" ] || exit 0
          {
            echo '### HOL Plugin Scanner'
            echo '```'
            cat "$report"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
