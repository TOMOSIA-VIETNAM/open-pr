description = "Remove the git worktrees open-pr review checked PR code out into. Asks before deleting."

prompt = """
Locate the plugin: `ls -d ~/.gemini/extensions/*/adapters/root.md 2>/dev/null`.
No output → tell the user open-pr is not installed for Gemini CLI (see its docs/install.md) and STOP.
More than one → that file's ROOT table says what to do; never pick one silently.
Read that file → ROOT + this platform's tool names.
Read ROOT/commands/clean.md and obey it VERBATIM, every step, in order. `{{args}}` is what that
file's `Usage:` block expects.
This command deletes directories; what may and may not be deleted is stated there, and nothing is
deleted before the user answers.
FORBIDDEN: summarizing, reordering or skipping a step; deleting from what this file says.
"""
