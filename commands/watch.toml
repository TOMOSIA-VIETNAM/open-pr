description = "Watch the PRs of one or more repos for an /open-pr comment and open one review session per PR on this machine."

prompt = """
Locate the plugin: `ls -d ~/.gemini/extensions/*/adapters/root.md 2>/dev/null`.
No output → tell the user open-pr is not installed for Gemini CLI (see its docs/install.md) and STOP.
More than one → that file's ROOT table says what to do; never pick one silently.
Read that file → ROOT + this platform's tool names and review-session runner.
Read ROOT/commands/watch.md and obey it VERBATIM, every step, in order. `{{args}}` is what that
file's `Usage:` block expects.
FORBIDDEN: summarizing, reordering or skipping a step; reviewing a PR in this session.
"""
