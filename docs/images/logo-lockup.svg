<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 110" role="img" aria-label="Open PullRequest">
  <defs>
    <linearGradient id="accent" x1="64" y1="4" x2="130" y2="66" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FF8F6B"/>
      <stop offset="1" stop-color="#B84328"/>
    </linearGradient>
  </defs>
  <!-- nudge left so lens+handle optically sit on center -->
  <g transform="translate(-4 0)">
    <circle cx="100" cy="36" r="20" fill="none" stroke="url(#accent)" stroke-width="3.75"/>
    <circle cx="100" cy="36" r="7.25" fill="#1F1E1D"/>
    <circle cx="96.8" cy="33" r="2.2" fill="#FFF8F4"/>
    <path d="M114.5 50.5 128 68" fill="none" stroke="url(#accent)" stroke-width="3.75" stroke-linecap="round"/>
  </g>
  <text
    x="100"
    y="96"
    text-anchor="middle"
    font-family="Inter, 'SF Pro Display', 'Helvetica Neue', Arial, sans-serif"
    font-size="30"
    font-weight="600"
    fill="#1F1E1D"
    letter-spacing="-0.6"
  >open-pr</text>
</svg>
